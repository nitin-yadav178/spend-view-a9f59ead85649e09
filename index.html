<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Spend Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:#0f1117; --bg-tab:#13151f;
  --surface:#1a1d2e; --surface-2:#232640; --surface-3:#1e2030;
  --border:#2a2d3e; --border-strong:#3a3f6b; --border-strong-hover:#4a4f8b;
  --divider:#1e2030; --divider-table:#1a1c28;
  --ink:#e8eaf0; --ink-strong:#fff; --muted:#8b8fa8; --muted-2:#c8cad8;
  --accent:#5b61a8; --accent-2:#8b8ff0;
  --danger:#e63946; --danger-bg:#2e0d0d;
  --warning:#f4a261;
  --success:#2ec4b6; --success-bg:#0d2e2b;
  --info:#5b8dee;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }

/* ── Header ── */
.header { background:linear-gradient(135deg,var(--surface),var(--surface-2)); padding:24px 40px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.header h1 { font-size:19px; font-weight:600; color:var(--ink-strong); }
.header .sub { font-size:12px; color:var(--muted); margin-top:3px; }

/* ── Tab bar ── */
.tab-bar { background:var(--bg-tab); border-bottom:1px solid var(--border); padding:0 40px; display:flex; align-items:center; gap:4px; overflow-x:auto; }
.tab { padding:14px 20px; font-size:13px; font-weight:500; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; transition:all .2s; }
.tab:hover { color:var(--muted-2); }
.tab.active { color:var(--ink-strong); border-bottom-color:var(--accent); }
.tab.trends { margin-left:auto; color:var(--info); }
.tab.trends.active { color:var(--info); border-bottom-color:var(--info); }
.tab-divider { width:1px; height:20px; background:var(--border); margin:0 8px; }

/* ── Container ── */
.container { max-width:1400px; margin:0 auto; padding:32px 40px; }
.view { display:none; }
.view.active { display:block; }

/* ── KPI row ── */
.kpi-row { display:grid; grid-template-columns:repeat(6,1fr); gap:16px; margin-bottom:28px; }
.kpi { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px 22px; }
.kpi .label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
.kpi .value { font-size:24px; font-weight:700; }
.kpi .sub { font-size:12px; color:var(--muted); margin-top:4px; }
.kpi.red .value { color:var(--danger); }
.kpi.yellow .value { color:var(--warning); }
.kpi.teal .value { color:var(--success); }
.kpi.blue .value { color:var(--info); }

/* ── Charts row ── */
.charts-row { display:grid; grid-template-columns:380px 1fr; gap:20px; margin-bottom:28px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:22px; }
.card h2 { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:18px; }

.donut-wrap { position:relative; width:220px; height:220px; margin:0 auto 18px; }
.donut-center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; }
.donut-center .big { font-size:20px; font-weight:700; color:var(--ink-strong); }
.donut-center .sm { font-size:11px; color:var(--muted); }

.legend { display:flex; flex-direction:column; gap:6px; }
.legend-item { display:flex; align-items:center; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--divider); }
.legend-item:last-child { border-bottom:none; }
.dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.legend-name { font-size:12px; color:var(--muted-2); margin-left:9px; }
.legend-amt { font-size:12px; font-weight:600; color:var(--ink-strong); }
.legend-pct { font-size:11px; color:var(--muted); width:30px; text-align:right; margin-left:10px; }

.bar-wrap { height:300px; }

/* ── Sunita row ── */
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:28px; }
.stat-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--divider); }
.stat-row:last-of-type { border-bottom:none; }
.stat-row .s-label { font-size:13px; color:var(--muted); }
.stat-row .s-val { font-size:13px; font-weight:600; color:var(--ink-strong); }
.progress-bar { background:var(--border); border-radius:4px; height:5px; margin-top:14px; }
.progress-fill { height:5px; border-radius:4px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); }

/* ── Transactions ── */
.txn-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:22px; }
.txn-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.filter-row { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
.filter-sub-row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.filter-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-right:2px; flex-shrink:0; }

/* ── Top card filter bar ── */
.card-filter-bar { display:flex; gap:8px; align-items:center; margin-bottom:22px; flex-wrap:wrap; }
.card-filter-bar-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-right:4px; }
.card-filter-btn { background:var(--surface-3); border:1px solid var(--border); color:var(--muted); padding:7px 18px; border-radius:20px; font-size:12px; font-weight:500; cursor:pointer; transition:all .2s; white-space:nowrap; }
.card-filter-btn:hover { color:var(--muted-2); border-color:var(--border-strong); }
.card-filter-btn.active { background:var(--border-strong); border-color:var(--accent); color:var(--ink-strong); box-shadow:0 0 0 1px #5b61a840; }
.filter-btn { background:var(--surface-2); border:1px solid var(--border); color:var(--muted); padding:5px 12px; border-radius:16px; font-size:11px; cursor:pointer; transition:all .2s; }
.filter-btn:hover,.filter-btn.active { background:var(--border-strong); border-color:var(--accent); color:var(--ink-strong); }
.search-box { background:var(--surface-2); border:1px solid var(--border); color:var(--ink); padding:7px 12px; border-radius:8px; font-size:12px; width:200px; outline:none; }
.search-box:focus { border-color:var(--accent); }

table.txn { width:100%; border-collapse:collapse; }
table.txn th { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; padding:8px 14px; text-align:left; border-bottom:1px solid var(--border); }
table.txn td { padding:10px 14px; font-size:13px; border-bottom:1px solid var(--divider-table); }
table.txn tr:last-child td { border-bottom:none; }
table.txn tr:hover td { background:var(--surface-3); }
.cat-pill { display:inline-block; padding:2px 9px; border-radius:10px; font-size:11px; font-weight:500; }
.amt-debit { font-weight:600; color:var(--ink); }
.amt-credit { font-weight:600; color:var(--success); }
.amt-large { font-weight:600; color:var(--danger); }
.card-tag { font-size:11px; color:var(--muted); }
.no-results { text-align:center; color:var(--muted); padding:28px; font-size:13px; }

/* ── Bill reconciliation ── */
.recon { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 24px 20px; margin-bottom:20px; }
.recon-head { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:16px; }
.recon-head h2 { font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
.recon-head .period { font-size:11px; color:var(--muted); }
.recon-eq { display:flex; align-items:flex-start; gap:20px; flex-wrap:wrap; }
.recon-term { min-width:0; }
.recon-term .amt { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.01em; line-height:1.15; }
.recon-term .name { font-size:12px; color:var(--muted-2); margin-top:5px; }
.recon-term .note { font-size:11px; color:var(--muted); margin-top:2px; }
.recon-term.carry .amt { color:var(--warning); }
.recon-term.spend .amt { color:var(--ink-strong); }
.recon-term.total .amt { font-size:27px; color:var(--danger); }
.recon-op { font-size:19px; font-weight:400; color:var(--muted); line-height:1.35; flex:none; }
.recon-op.eq { color:var(--muted-2); }
.recon-flag { margin-top:14px; padding-top:12px; border-top:1px solid var(--divider); font-size:11px; color:var(--muted); }
.recon-flag b { color:var(--warning); font-weight:600; }
@media (max-width:720px) {
  .recon-eq { flex-direction:column; gap:12px; }
  .recon-op { display:none; }
  .recon-term.total { padding-top:12px; border-top:1px solid var(--divider); width:100%; }
}

/* ── Range view ── */
.range-controls { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px 24px; margin-bottom:24px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
.range-controls label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; display:flex; flex-direction:column; gap:6px; }
.range-controls input[type=date] { background:var(--surface-2); border:1px solid var(--border); color:var(--ink); padding:7px 12px; border-radius:8px; font-size:13px; outline:none; cursor:pointer; }
.range-controls input[type=date]:focus { border-color:var(--accent); }
.range-apply { background:var(--border-strong); border:1px solid var(--accent); color:var(--ink-strong); padding:8px 22px; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; margin-top:16px; transition:all .2s; }
.range-apply:hover { background:var(--border-strong-hover); }
.range-summary { font-size:12px; color:var(--muted); margin-left:auto; }
.range-kpi-row { display:grid; grid-template-columns:repeat(5,1fr); gap:16px; margin-bottom:24px; }

/* ── Trends view ── */
.trends-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:28px; }
.trends-full { margin-bottom:28px; }
.chart-tall { height:320px; }
.chart-med { height:260px; }
.placeholder-msg { text-align:center; padding:40px; color:var(--muted); font-size:13px; border:1px dashed var(--border); border-radius:8px; margin-top:8px; }

/* ── Reimbursable ── */
.reimb-btn { background:transparent; border:1px solid var(--border); color:var(--muted); padding:3px 9px; border-radius:10px; font-size:10px; cursor:pointer; transition:all .2s; opacity:.55; white-space:nowrap; }
table.txn tr:hover .reimb-btn, table.txn tr:focus-within .reimb-btn, .reimb-btn:focus-visible { opacity:1; }
.reimb-btn.active { background:var(--success-bg); border-color:var(--success); color:var(--success); opacity:1 !important; }
tr.reimb-row td { background:#0d2020 !important; }

/* ── Exclude ── */
.exclude-btn { background:transparent; border:1px solid var(--border); color:var(--muted); padding:3px 9px; border-radius:10px; font-size:10px; cursor:pointer; transition:all .2s; opacity:.55; white-space:nowrap; margin-left:4px; }
table.txn tr:hover .exclude-btn, table.txn tr:focus-within .exclude-btn, .exclude-btn:focus-visible { opacity:1; }
.exclude-btn.active { background:var(--danger-bg); border-color:var(--danger); color:var(--danger); opacity:1 !important; }
tr.exclude-row td { opacity:0.45; }
tr.exclude-row td:nth-child(2) { text-decoration:line-through; }

/* ── Category edit ── */
.cat-pill { cursor:pointer; transition:opacity .15s; }
.cat-pill:hover { opacity:0.75; }
.cat-select { appearance:none; border:none; outline:none; cursor:pointer; padding:2px 9px; border-radius:10px; font-size:11px; font-weight:500; }
.note-input { background:var(--surface-2); border:1px solid var(--border); color:var(--ink); padding:5px 9px; border-radius:6px; font-size:11.5px; width:100%; outline:none; }
.note-input::placeholder { color:#5b5f74; }
.note-input:focus { border-color:var(--accent); }
.note-input:not(:placeholder-shown) { border-color:#3a5a4a; background:#1a2420; }

/* ── Budget strip ── */
.budget-strip { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 22px; margin-bottom:20px; }
.budget-top { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:12px; }
.budget-left { display:flex; align-items:center; gap:10px; }
.budget-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
.budget-input { background:var(--surface-2); border:1px solid var(--border); color:var(--ink); padding:6px 10px; border-radius:8px; font-size:14px; font-weight:600; width:130px; outline:none; }
.budget-input:focus { border-color:var(--accent); }
.budget-right { display:flex; align-items:center; gap:14px; font-size:13px; }
.budget-spent { color:var(--muted-2); }
.budget-spent b { color:var(--ink-strong); }
.budget-chip { padding:4px 12px; border-radius:14px; font-size:12px; font-weight:600; }
.budget-chip.ok { background:var(--success-bg); color:var(--success); }
.budget-chip.over { background:var(--danger-bg); color:var(--danger); }
.budget-mom { font-size:12px; color:var(--muted); }
.budget-mom .up { color:var(--danger); font-weight:600; }
.budget-mom .down { color:var(--success); font-weight:600; }
.budget-bar { background:var(--border); border-radius:5px; height:8px; overflow:hidden; }
.budget-fill { width:100%; height:8px; border-radius:5px; transform-origin:left; transform:scaleX(0); transition:transform .4s; }
.budget-empty { font-size:12px; color:var(--muted); }

/* ── Recurring + MoM cards ── */
.card .card-sub { font-size:11px; color:var(--muted); font-weight:400; text-transform:none; letter-spacing:0; margin-top:-12px; margin-bottom:16px; }
.recurring-summary { font-size:13px; color:var(--muted-2); margin-bottom:14px; }
.recurring-summary b { color:var(--ink-strong); }
.mom-total { font-size:22px; font-weight:700; margin-bottom:4px; }
.mom-total.up { color:var(--danger); }
.mom-total.down { color:var(--success); }
.mom-sub { font-size:12px; color:var(--muted); margin-bottom:16px; }
.mover-row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--divider); font-size:13px; }
.mover-row:last-child { border-bottom:none; }
.mover-name { color:var(--muted-2); }
.mover-delta.up { color:var(--danger); font-weight:600; }
.mover-delta.down { color:var(--success); font-weight:600; }

/* ── CSV button ── */
.csv-btn { background:var(--surface-2); border:1px solid var(--border); color:var(--muted); padding:7px 14px; border-radius:8px; font-size:12px; font-weight:500; cursor:pointer; transition:all .2s; margin-left:8px; }
.csv-btn:hover { color:var(--ink-strong); border-color:var(--accent); }

/* ── Focus visibility (keyboard) ── */
.search-box:focus-visible, .budget-input:focus-visible, .range-controls input[type=date]:focus-visible,
.cat-select:focus-visible, .range-apply:focus-visible, .card-filter-btn:focus-visible,
.filter-btn:focus-visible, .reimb-btn:focus-visible, .exclude-btn:focus-visible,
.csv-btn:focus-visible, .tab:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ── Reduced motion ── */
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.001ms !important; }
}

/* ── Responsive ── */
@media (max-width: 1150px) {
  .kpi-row { grid-template-columns: repeat(3, 1fr); }
  .charts-row { grid-template-columns: 1fr; }
  .range-kpi-row { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 760px) {
  .header { padding:20px; }
  .tab-bar, .container { padding-left:20px; padding-right:20px; }
  .container { padding-top:24px; padding-bottom:24px; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .two-col, .trends-grid { grid-template-columns: 1fr; }
  .range-kpi-row { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) {
  .kpi-row, .range-kpi-row { grid-template-columns: 1fr; }
  .search-box { width: 140px; }
}
.cloud-sync-indicator { margin-top:4px; font-size:11px; min-height:14px; }
.cloud-sync-indicator.sync-syncing { color:#f4a261; }
.cloud-sync-indicator.sync-ok { color:#2ec4b6; }
.cloud-sync-indicator.sync-err { color:#e63946; }
</style>
</head>

<div class="container">

//  CONSTANTS
// ═══════════════════════════════════════════════
const COLORS = ['#e63946','#f4a261','#2ec4b6','#5b8dee','#a78bfa','#fb923c','#34d399','#f472b6','#60a5fa','#facc15','#94a3b8','#e879f9'];
const ALL_CATS = ['Food & Dining','Home & Furniture','Travel','Shopping','Subscriptions','Home Services','Grocery + QC','Health','Transport','Taxes'];

function catColor(name) {
  const idx = ALL_CATS.indexOf(name);
  return COLORS[idx >= 0 ? idx : COLORS.length - 1];
}

// ═══════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════
function fmt(n) { return '₹' + Math.round(n).toLocaleString('en-IN'); }
function fmtL(n) { return n >= 100000 ? '₹' + (n/100000).toFixed(2) + 'L' : fmt(n); }

// card = 'All' | specific card name — drives KPIs, charts, transactions
//
// Net Spend = what this statement actually bills you = total payment due.
// That is new charges this cycle PLUS any balance carried over unpaid from
// the previous cycle. Bill payments (cat 'Payments') settle the balance and
// are never spend. `newCharges` is the period-only figure, kept separate so
// month-over-month comparisons don't double-count carried debt.
function getStats(stmt, card) {
  const allTxns = card === 'All' ? stmt.txns : stmt.txns.filter(t => t.card === card);
  const txns = allTxns.filter(t => !effExcl(t, stmt.id) && !effReimb(t, stmt.id));
  const showAddOn = card === 'All' || card === 'HSBC TravelOne';
  const addOnNet = showAddOn ? stmt.addOnNet : 0;
  const spendTxns = txns.filter(t => t.cat !== 'Payments');
  const newCharges = spendTxns.reduce((s,t)=>s+(t.credit?-t.amount:t.amount),0) + addOnNet;
  // carry-forward belongs to the whole account, so only on the unfiltered view
  const carry = (card === 'All' && stmt.carryForward) ? stmt.carryForward : 0;
  const netSpend = newCharges + carry;
  const catMap = {};
  spendTxns.filter(t=>!t.credit).forEach(t => { const c=effCat(t,stmt.id); catMap[c]=(catMap[c]||0)+t.amount; });
  if (showAddOn && addOnNet > 0) catMap['Add-on (Sunita)'] = addOnNet;
  if (carry > 0) catMap['Carried Forward'] = carry;
  const cats = Object.entries(catMap)
    .map(([name,amount]) => ({name, amount,
      color: name.startsWith('Add-on') ? '#2ec4b6' : name === 'Carried Forward' ? '#f4a261' : catColor(name)}))
    .sort((a,b)=>b.amount-a.amount);
  return { netSpend, newCharges, carry, cats, txns };
}

// kept for trends view (always uses all-card totals)
function getCategoryTotals(stmt) { return getStats(stmt,'All').cats; }
function getNetSpend(stmt)        { return getStats(stmt,'All').netSpend; }
// period-only spend — used where carried debt would double-count across months
function getNewCharges(stmt)      { return getStats(stmt,'All').newCharges; }

// ═══════════════════════════════════════════════
//  CLOUD SYNC — durable layer via Cloudflare Worker + KV
// ═══════════════════════════════════════════════
// Browser-only localStorage used to be the sole store for reimburse/exclude/
// notes/catOverrides/budget — gone on a cache clear, invisible across
// devices. This Worker+KV layer makes those edits durable: every save also
// pushes the combined state to the Worker, and page load pulls the latest
// from the Worker before rendering, so any browser/device sees the same
// data. The HTML file's baked-in t.reimbursable/t.exclude/t.note fields
// remain the long-term canonical record (synced via git); this cloud layer
// is the live scratch space between those periodic reconciliations.
const CLOUD_SYNC_URL = 'https://spend-dashboard-worker.nitinyadav17897.workers.dev/state';
const CLOUD_SYNC_TOKEN = 'xN8kE-fxC98qpvuk-LAUaDR8osYbmiK7gsMQ759ODio';
let cloudSyncStatus = 'idle'; // idle | syncing | synced | error
let _cloudSyncTimer = null;

function setCloudSyncStatus(s) {
  cloudSyncStatus = s;
  const el = document.getElementById('cloud-sync-indicator');
  if (!el) return;
  const map = {
    idle:    { text: '', cls: '' },
    syncing: { text: '⏳ Syncing…', cls: 'sync-syncing' },
    synced:  { text: '☁ Synced', cls: 'sync-ok' },
    error:   { text: '⚠ Sync failed (saved locally)', cls: 'sync-err' },
  };
  const m = map[s] || map.idle;
  el.textContent = m.text;
  el.className = 'cloud-sync-indicator ' + m.cls;
}

function pullCloudState() {
  return fetch(CLOUD_SYNC_URL, { method: 'GET' })
    .then(r => r.ok ? r.json() : {})
    .then(data => {
      if (data.reimburse)    reimburseData = data.reimburse;
      if (data.exclude)      excludeData   = data.exclude;
      if (data.notes)        notesData     = data.notes;
      if (data.catOverrides) catOverrides  = data.catOverrides;
      if (data.budget)       budgetData    = data.budget;
      // mirror into localStorage so an offline reload still has the latest pull
      saveReimburse(); saveExclude(); saveNotes(); saveCatOverrides(); saveBudget();
    })
    .catch(() => { /* offline or Worker unreachable — fall back to localStorage silently */ });
}

function pushCloudState() {
  setCloudSyncStatus('syncing');
  clearTimeout(_cloudSyncTimer);
  _cloudSyncTimer = setTimeout(() => {
    const payload = JSON.stringify({
      reimburse: reimburseData,
      exclude: excludeData,
      notes: notesData,
      catOverrides: catOverrides,
      budget: budgetData,
    });
    fetch(CLOUD_SYNC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Auth-Token': CLOUD_SYNC_TOKEN },
      body: payload,
    })
      .then(r => setCloudSyncStatus(r.ok ? 'synced' : 'error'))
      .catch(() => setCloudSyncStatus('error'));
  }, 600); // debounce rapid toggles into one request
}

//  REIMBURSABLE — storage + helpers
// ═══════════════════════════════════════════════
let reimburseData = {};
function loadReimburse() { try { reimburseData = JSON.parse(localStorage.getItem('reimburse_v1')||'{}'); } catch(e) { reimburseData = {}; } }
function saveReimburse() { localStorage.setItem('reimburse_v1', JSON.stringify(reimburseData)); }
function reimbKey(t, stmtId) { return `${stmtId}::${t.date}::${t.merchant}::${t.amount}`; }
// effReimb: localStorage override (if user toggled live) wins, else fall back to the
// reimbursable flag baked into the transaction data (synced via git, survives across devices/browsers)
function effReimb(t, stmtId) {
  const k = reimbKey(t, stmtId);
  return (reimburseData[k] !== undefined) ? reimburseData[k] : !!t.reimbursable;
}
function getReimbTotal(stmtId) {
  const stmt = STATEMENTS.find(s=>s.id===stmtId);
  return stmt.txns.filter(t => effReimb(t,stmtId) && !t.credit).reduce((s,t)=>s+t.amount,0);
}
function getReimbCount(stmtId) {
  const stmt = STATEMENTS.find(s=>s.id===stmtId);
  return stmt.txns.filter(t => effReimb(t,stmtId) && !t.credit).length;
}
function toggleReimburse(stmtId, key) {
  reimburseData[key] = !reimburseData[key];
  if (!reimburseData[key]) delete reimburseData[key];
  saveReimburse();
  pushCloudState();
  updateMonthView(stmtId, activeTopCard[stmtId] || 'All');
}
loadReimburse();

function excludeKey(t, stmtId) { return `${stmtId}::${t.date}::${t.merchant}::${t.amount}`; }
// effExcl: localStorage override (if user toggled live) wins, else fall back to the
// exclude flag baked into the transaction data (synced via git, survives across devices/browsers)
function effExcl(t, stmtId) {
  const k = excludeKey(t, stmtId);
  return (excludeData[k] !== undefined) ? excludeData[k] : !!t.exclude;
}
function getExcludeTotal(stmtId) {
  const stmt = STATEMENTS.find(s=>s.id===stmtId);
  return stmt.txns.filter(t => effExcl(t,stmtId) && !t.credit).reduce((s,t)=>s+t.amount,0);
}
function getExcludeCount(stmtId) {

function toggleExclude(stmtId, key) {

// ═══════════════════════════════════════════════
let notesData = {};
function loadNotes() { try { notesData = JSON.parse(localStorage.getItem('notes_v1')||'{}'); } catch(e) { notesData = {}; } }
function saveNotes() { localStorage.setItem('notes_v1', JSON.stringify(notesData)); }
function noteKey(t, stmtId) { return `${stmtId}::${t.date}::${t.merchant}::${t.amount}`; }
function setNote(stmtId, key, val) {
  if (val && val.trim()) notesData[key] = val.trim();
  else delete notesData[key];
  saveNotes();
  pushCloudState();
}
// effNote: localStorage override (if user edited live) wins, else fall back to the
// note baked into the transaction data (synced via git, survives across devices/browsers)
function effNote(t, stmtId) {
  const k = noteKey(t, stmtId);
  return (notesData[k] !== undefined) ? notesData[k] : (t.note || '');
}
loadNotes();

function loadCatOverrides() { try { catOverrides = JSON.parse(localStorage.getItem('cat_overrides_v1')||'{}'); } catch(e) { catOverrides = {}; } }
function saveCatOverrides() { localStorage.setItem('cat_overrides_v1', JSON.stringify(catOverrides)); }
function catOverrideKey(t, stmtId) { return `${stmtId}::${t.date}::${t.merchant}::${t.amount}`; }
function effCat(t, stmtId) { return catOverrides[catOverrideKey(t, stmtId)] || t.cat; }
let _allCategoriesCache = null;
function allCategories() {
  if (_allCategoriesCache) return _allCategoriesCache;
  const cats = new Set(ALL_CATS);
  STATEMENTS.forEach(s => s.txns.forEach(t => cats.add(t.cat)));
  return _allCategoriesCache = [...cats].sort();
}
function setCatOverride(stmtId, key, newCat) {
  catOverrides[key] = newCat;
  saveCatOverrides();
  pushCloudState();
  updateMonthView(stmtId, activeTopCard[stmtId] || 'All');
}
loadCatOverrides();

let budgetData = {};
function loadBudget() { try { budgetData = JSON.parse(localStorage.getItem('budget_v1')||'{}'); } catch(e) { budgetData = {}; } }
function saveBudget() { localStorage.setItem('budget_v1', JSON.stringify(budgetData)); }
function setBudget(val) {

  budgetData.cap = n;

  pushCloudState();
  STATEMENTS.forEach(s => renderBudget(s.id)); // cap is global → refresh every month
}

// ═══════════════════════════════════════════════
//  RECURRING CHARGES — detect merchants billed across 2+ months
// ═══════════════════════════════════════════════
function normMerchant(name) {
  return name
    .toLowerCase()
    .replace(/\([^)]*\)/g, ' ')   // drop parentheticals: (x2), (refund), (USD 23.60)
    .replace(/\bx\d+\b/g, ' ')    // drop standalone x2 etc.
    .replace(/[0-9]/g, ' ')        // drop stray digits
    .replace(/\s+/g, ' ')
    .trim();
}

let _recurringCache = null;
function getRecurring() {
  if (_recurringCache) return _recurringCache;
  const map = {}; // norm → { label, months:Set, total }
  STATEMENTS.forEach(s => {
    s.txns.filter(t => !t.credit).forEach(t => {
      const k = normMerchant(t.merchant);
      if (!k) return;
      if (!map[k]) map[k] = { label: t.merchant.replace(/\s*\([^)]*\)\s*/g,'').trim() || t.merchant, months:new Set(), total:0 };
      map[k].months.add(s.id);
      map[k].total += t.amount;
    });
  });
  // recurring = seen in ≥2 distinct months
  _recurringCache = Object.entries(map)
    .filter(([,v]) => v.months.size >= 2)
    .reduce((o,[k,v]) => { o[k] = v; return o; }, {});
  return _recurringCache;
}

// recurring merchants that have a charge in THIS month
function getMonthRecurring(stmt) {
  const rec = getRecurring();
  const thisMonth = {}; // norm → amount this month
  stmt.txns.filter(t => !t.credit).forEach(t => {
    const k = normMerchant(t.merchant);
    if (rec[k]) thisMonth[k] = (thisMonth[k]||0) + t.amount;
  });
  return Object.entries(thisMonth).map(([k, amt]) => {
    const r = rec[k];
    const avg = r.total / r.months.size;
    return { label:r.label, amount:amt, months:r.months.size, annual:avg*12 };
  }).sort((a,b) => b.amount - a.amount);
}

// ═══════════════════════════════════════════════
//  MONTH-OVER-MONTH — vs previous statement in the array
// ═══════════════════════════════════════════════
function getMoM(stmtId) {
  const idx = STATEMENTS.findIndex(s => s.id === stmtId);
  if (idx < 1) return null; // first month, nothing to compare
  const cur = STATEMENTS[idx], prev = STATEMENTS[idx-1];
  const curS = getStats(cur, 'All'), prevS = getStats(prev, 'All');
  // compare period spend, not total due — carried debt was already counted
  // in the month it was charged, so including it would double-count
  const totalDelta = curS.newCharges - prevS.newCharges;
  const pct = prevS.newCharges ? (totalDelta / prevS.newCharges) * 100 : 0;
  // category movers
  const curCat = {}, prevCat = {};
  curS.cats.forEach(c => curCat[c.name] = c.amount);
  prevS.cats.forEach(c => prevCat[c.name] = c.amount);
  const names = new Set([...Object.keys(curCat), ...Object.keys(prevCat)]);
  const movers = [...names].map(n => ({ name:n, delta:(curCat[n]||0) - (prevCat[n]||0) }));
  const topUp = movers.filter(m => m.delta > 0).sort((a,b) => b.delta - a.delta).slice(0,2);
  const topDown = movers.filter(m => m.delta < 0).sort((a,b) => a.delta - b.delta).slice(0,1);
  return { prevLabel:prev.label, totalDelta, pct, topUp, topDown };
}

// ═══════════════════════════════════════════════
//  CSV EXPORT — current filtered view
// ═══════════════════════════════════════════════
function csvCell(v) { const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
function exportCSV(stmtId) {
  const stmt = STATEMENTS.find(s => s.id === stmtId);
  const rows = getFilteredTxns(stmtId);
  const header = ['Date','Merchant','Card','Category','Amount','Credit','Note'];
  const lines = [header.join(',')];
  rows.forEach(t => {
    lines.push([t.date, t.merchant, t.card||'', effCat(t, stmtId), t.amount, t.credit?'Yes':'No', effNote(t,stmtId)].map(csvCell).join(','));
  });
  const blob = new Blob([lines.join('\n')], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'spend-' + stmt.label.replace(/\s+/g,'-').toLowerCase() + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════════
//  RENDER — budget strip + MoM card
// ═══════════════════════════════════════════════
function renderBudget(stmtId) {
  const wrap = document.getElementById('budget-'+stmtId);
  if (!wrap) return;
  const stmt = STATEMENTS.find(s => s.id === stmtId);
  // a spending cap measures this cycle's charges, not debt carried in
  const spent = getStats(stmt, 'All').newCharges; // overall — ignores card filter
  const cap = budgetData.cap || 0;
  const inputEl = document.getElementById('budget-input-'+stmtId);
  if (inputEl && document.activeElement !== inputEl) inputEl.value = cap || '';

  const bar = document.getElementById('budget-bar-'+stmtId);
  const spentEl = document.getElementById('budget-spent-'+stmtId);
  const chip = document.getElementById('budget-chip-'+stmtId);

  if (!cap) {
    spentEl.innerHTML = `Spent this cycle <b>${fmtL(spent)}</b>`;
    bar.style.transform = 'scaleX(0)';
    chip.className = 'budget-chip';
    chip.textContent = 'Set a cap to track';
    return;
  }
  const pct = (spent / cap) * 100;
  spentEl.innerHTML = `Spent this cycle <b>${fmtL(spent)}</b> of ${fmtL(cap)} (${pct.toFixed(0)}%)`;
  bar.style.transform = 'scaleX(' + (Math.min(pct, 100) / 100) + ')';
  bar.style.background = pct > 100 ? '#e63946' : (pct >= 80 ? '#f4a261' : '#2ec4b6');
  if (spent > cap) { chip.className = 'budget-chip over'; chip.textContent = '⚠ Over by ' + fmt(spent - cap); }
  else { chip.className = 'budget-chip ok'; chip.textContent = '✓ ' + fmt(cap - spent) + ' left'; }
}

function renderRecurring(stmtId) {
  const wrap = document.getElementById('recurring-'+stmtId);
  if (!wrap) return;
  const stmt = STATEMENTS.find(s => s.id === stmtId);
  const list = getMonthRecurring(stmt);
  if (!list.length) { wrap.innerHTML = `<div class="placeholder-msg">No recurring merchants this month yet.</div>`; return; }
  const monthly = list.reduce((s,r) => s + r.amount, 0);
  const annual = list.reduce((s,r) => s + r.annual, 0);
  let html = `<div class="recurring-summary"><b>${fmtL(monthly)}</b> this month · ${list.length} merchant${list.length!==1?'s':''} · ~<b>${fmtL(annual)}</b>/yr</div>`;
  html += `<table class="txn"><thead><tr><th>Merchant</th><th style="text-align:center">Months</th><th style="text-align:right">This month</th><th style="text-align:right">~ / yr</th></tr></thead><tbody>`;
  list.forEach(r => {
    html += `<tr><td>${r.label}</td><td style="text-align:center;color:#8b8fa8">${r.months}</td><td style="text-align:right" class="amt-debit">${fmt(r.amount)}</td><td style="text-align:right;color:#8b8fa8">${fmtL(r.annual)}</td></tr>`;
  });
  html += `</tbody></table>`;
  wrap.innerHTML = html;
}

function renderMoM(stmtId) {
  const m = getMoM(stmtId);
  // budget-strip one-liner
  const momLine = document.getElementById('budget-mom-'+stmtId);
  if (momLine) {
    if (!m) momLine.innerHTML = '';
    else {
      const dir = m.totalDelta >= 0 ? 'up' : 'down';
      const arr = m.totalDelta >= 0 ? '↑' : '↓';
      momLine.innerHTML = `<span class="${dir}">${arr} ${Math.abs(m.pct).toFixed(0)}%</span> vs ${m.prevLabel}`;
    }
  }
  // MoM card body
  const body = document.getElementById('mom-body-'+stmtId);
  if (!body) return;
  if (!m) { body.innerHTML = `<div class="placeholder-msg">First month — no comparison yet.</div>`; return; }
  const dir = m.totalDelta >= 0 ? 'up' : 'down';
  const arr = m.totalDelta >= 0 ? '↑' : '↓';
  let html = `<div class="mom-total ${dir}">${arr} ${fmt(Math.abs(m.totalDelta))}</div>`;
  html += `<div class="mom-sub">${m.totalDelta >= 0 ? 'more' : 'less'} than ${m.prevLabel} (${arr} ${Math.abs(m.pct).toFixed(0)}%)</div>`;
  m.topUp.forEach(x => { html += `<div class="mover-row"><span class="mover-name">${x.name}</span><span class="mover-delta up">↑ ${fmt(x.delta)}</span></div>`; });
  m.topDown.forEach(x => { html += `<div class="mover-row"><span class="mover-name">${x.name}</span><span class="mover-delta down">↓ ${fmt(Math.abs(x.delta))}</span></div>`; });
  body.innerHTML = html;
}

// ═══════════════════════════════════════════════
//  CHART RENDER / UPDATE

const stmtCharts = {};
const activeTopCard = {};
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

function renderCharts(stmt, cats, netSpend) {
  const id = stmt.id;
  if (stmtCharts[id]) { stmtCharts[id].donut?.destroy(); stmtCharts[id].bar?.destroy(); }
  const donut = new Chart(document.getElementById('donut-'+id), {
    type:'doughnut',
    data:{ labels:cats.map(c=>c.name), datasets:[{ data:cats.map(c=>c.amount), backgroundColor:cats.map(c=>c.color), borderWidth:2, borderColor:'#1a1d2e', hoverOffset:5 }] },
    options:{ cutout:'66%', plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx=>` ${fmt(ctx.parsed)} (${((ctx.parsed/netSpend)*100).toFixed(1)}%)` }}}, animation:{duration:REDUCED_MOTION?0:400} }
  });
  const bar = new Chart(document.getElementById('bar-'+id), {
    type:'bar',
    data:{ labels:cats.map(c=>c.name), datasets:[{ data:cats.map(c=>c.amount), backgroundColor:cats.map(c=>c.color+'bb'), borderColor:cats.map(c=>c.color), borderWidth:1, borderRadius:5 }] },
    options:{ indexAxis:'y', plugins:{legend:{display:false}, tooltip:{callbacks:{label:ctx=>` ${fmt(ctx.parsed.x)}`}}}, scales:{ x:{grid:{color:'#2a2d3e'}, ticks:{color:'#8b8fa8', callback:v=>'₹'+(v/1000).toFixed(0)+'k'}}, y:{grid:{display:false}, ticks:{color:'#c8cad8', font:{size:12}}} }, animation:{duration:REDUCED_MOTION?0:400} }
  });
  stmtCharts[id] = { donut, bar };
  const leg = document.getElementById('legend-'+id);
  leg.innerHTML = '';
  cats.forEach(c => {
    leg.innerHTML += `<div class="legend-item"><div style="display:flex;align-items:center"><div class="dot" style="background:${c.color}"></div><span class="legend-name">${c.name}</span></div><div style="display:flex;align-items:center"><span class="legend-amt">${fmt(c.amount)}</span><span class="legend-pct">${((c.amount/netSpend)*100).toFixed(0)}%</span></div></div>`;
  });
}

function updateMonthView(stmtId, card) {
  const stmt = STATEMENTS.find(s=>s.id===stmtId);
  const { netSpend, cats } = getStats(stmt, card);
  const topCat = cats[0];
  document.getElementById('kpi-spend-'+stmtId).textContent    = fmtL(netSpend);
  document.getElementById('kpi-topval-'+stmtId).textContent   = fmt(topCat.amount);
  document.getElementById('kpi-topsub-'+stmtId).textContent   = `${topCat.name} (${((topCat.amount/netSpend)*100).toFixed(0)}%)`;
  document.getElementById('donut-big-'+stmtId).textContent    = fmtL(netSpend);
  const rTotal = getReimbTotal(stmtId); const rCount = getReimbCount(stmtId);
  document.getElementById('kpi-reimb-'+stmtId).textContent    = fmtL(rTotal);
  document.getElementById('kpi-reimb-sub-'+stmtId).textContent = `${rCount} txn${rCount!==1?'s':''} · you'll get back`;
  const eTotal = getExcludeTotal(stmtId); const eCount = getExcludeCount(stmtId);
  document.getElementById('kpi-excl-'+stmtId).textContent     = fmtL(eTotal);
  document.getElementById('kpi-excl-sub-'+stmtId).textContent = `${eCount} txn${eCount!==1?'s':''} · removed from spend`;
  renderCharts(stmt, cats, netSpend);
  renderBudget(stmtId);
  renderMoM(stmtId);
  renderRecon(stmtId);
  renderTxns(stmtId);
}

// ═══════════════════════════════════════════════
//  BILL RECONCILIATION
//  Shows statement truth: carry-forward + new charges = total due.
//  Fixed figures straight off the statement — exclusions/reimbursements
//  reshape the Net Spend view, never the bill. Any gap is flagged below.
// ═══════════════════════════════════════════════
function reconHTML(stmt) {
  if (stmt.carryForward == null) return '';
  const newCharges = stmt.outstanding - stmt.carryForward;
  return `
    <div class="recon" id="recon-${stmt.id}">
      <div class="recon-head">
        <h2>Bill Reconciliation</h2>
        <span class="period">Statement ${stmt.period}</span>
      </div>
      <div class="recon-eq">
        <div class="recon-term carry">
          <div class="amt">${fmt(stmt.carryForward)}</div>
          <div class="name">Carried over, unpaid</div>
          <div class="note">${stmt.carryForwardNote || ''}</div>
        </div>
        <div class="recon-op">+</div>
        <div class="recon-term spend">
          <div class="amt">${fmt(newCharges)}</div>
          <div class="name">New charges this cycle</div>
          <div class="note">After refunds &amp; reversals</div>
        </div>
        <div class="recon-op eq">=</div>
        <div class="recon-term total">
          <div class="amt">${fmt(stmt.outstanding)}</div>
          <div class="name">Total payment due</div>
          <div class="note">By ${stmt.dueDate} · min ${fmt(stmt.minDue)}</div>
        </div>
      </div>
      <div class="recon-flag" id="recon-flag-${stmt.id}"></div>
    </div>`;
}

function renderRecon(stmtId) {
  const stmt = STATEMENTS.find(s=>s.id===stmtId);
  if (!stmt || stmt.carryForward == null) return;
  const flag = document.getElementById('recon-flag-'+stmtId);
  if (!flag) return;

  const stmtCharges = stmt.outstanding - stmt.carryForward;
  const { netSpend } = getStats(stmt, 'All');
  const gap   = stmt.outstanding - netSpend;
  const parts = [];

  if (getExcludeCount(stmtId))  parts.push(`${fmt(getExcludeTotal(stmtId))} excluded`);
  if (getReimbCount(stmtId))    parts.push(`${fmt(getReimbTotal(stmtId))} marked reimbursable`);

  if (parts.length) {
    flag.style.display = '';
    flag.innerHTML = `Net Spend reads <b>${fmtL(netSpend)}</b> — ${parts.join(' and ')}. `
                   + `The bill above is unaffected: you still owe ${fmt(stmt.outstanding)}.`;
  } else if (Math.abs(gap) > 50) {
    flag.style.display = '';
    flag.innerHTML = `Net Spend reads <b>${fmtL(netSpend)}</b>, ${fmt(Math.abs(gap))} `
                   + `${gap > 0 ? 'below' : 'above'} the billed total.`;
  } else if (gap !== 0) {
    flag.style.display = '';
    flag.innerHTML = `Net Spend matches the bill at <b>${fmtL(netSpend)}</b>. `
                   + `Line items are rounded to whole rupees, leaving a ${fmt(Math.abs(gap))} rounding difference `
                   + `against the statement's ${fmt(stmtCharges)} of new charges.`;
  } else {
    flag.style.display = 'none';
  }
}

        <h2>${stmt.addOnHolder} — Transactions</h2>

          <thead><tr><th>Date</th><th>Merchant</th><th style="text-align:right">Amount</th></tr></thead>
          <tbody>${stmt.addOnTxns.map(t => `
            <tr>
              <td style="color:#8b8fa8;white-space:nowrap">${t.date}</td>

      </div>

    <!-- Recurring + Month-over-Month -->
    <div class="two-col">
      <div class="card">
        <h2>Recurring Charges</h2>
        <div class="card-sub">Merchants billed across 2+ months</div>
        <div id="recurring-${stmt.id}"></div>
      </div>
      <div class="card">
        <h2>Month-over-Month</h2>
        <div class="card-sub">Net spend vs previous statement</div>

          <input class="search-box" id="search-${stmt.id}" type="text" placeholder="Search merchant…" oninput="renderTxns('${stmt.id}')">

      <div class="no-results" id="nores-${stmt.id}" style="display:none">No transactions found.</div>

  `;

  document.querySelector('.container').appendChild(div);
  requestAnimationFrame(() => renderCharts(stmt, cats, netSpend));
  buildFilters(stmt);
  renderBudget(stmt.id);
  renderRecurring(stmt.id);

const activeFilters = {};

function buildFilters(stmt) {
  activeFilters[stmt.id] = 'All';
  const fr = document.getElementById('filters-' + stmt.id);
  const catRow = document.createElement('div');
  catRow.className = 'filter-sub-row';
  catRow.innerHTML = '<span class="filter-label">Category</span>';
  const cats = ['All', ...new Set(stmt.txns.map(t => effCat(t, stmt.id)))].sort((a,b) => a==='All'?-1:b==='All'?1:a.localeCompare(b));
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat==='All'?' active':'');
    btn.textContent = cat;
    btn.onclick = () => {
      activeFilters[stmt.id] = cat;
      catRow.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTxns(stmt.id);
    };
    catRow.appendChild(btn);
  });
  // Reimbursable filter pill
  const reimbPill = document.createElement('button');
  reimbPill.className = 'filter-btn';
  reimbPill.textContent = '↩ Reimbursable';
  reimbPill.style.borderColor = '#2ec4b6';
  reimbPill.onclick = () => {
    activeFilters[stmt.id] = '__reimburse__';
    catRow.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    reimbPill.classList.add('active');
    renderTxns(stmt.id);
  };
  catRow.appendChild(reimbPill);
  // Excluded filter pill
  const exclPill = document.createElement('button');
  exclPill.className = 'filter-btn';
  exclPill.textContent = '✕ Excluded';
  exclPill.style.borderColor = '#e63946';
  exclPill.onclick = () => {
    activeFilters[stmt.id] = '__excluded__';
    catRow.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    exclPill.classList.add('active');
    renderTxns(stmt.id);
  };
  catRow.appendChild(exclPill);
  fr.appendChild(catRow);
}

function getFilteredTxns(id) {
  const stmt = STATEMENTS.find(s => s.id === id);
  const search = (document.getElementById('search-'+id)?.value||'').toLowerCase();
  const card = activeTopCard[id] || 'All';
  const showExcluded = activeFilters[id] === '__excluded__';
  return stmt.txns
    .filter(t => {
      const isExcl = effExcl(t, id);
      if (showExcluded) return isExcl;
      if (isExcl) return false;
      if (card !== 'All' && t.card !== card) return false;
      if (activeFilters[id] === '__reimburse__' && !effReimb(t,id)) return false;
      if (activeFilters[id] !== 'All' && activeFilters[id] !== '__reimburse__' && effCat(t, id) !== activeFilters[id]) return false;
      if (search && !t.merchant.toLowerCase().includes(search) && !t.cat.toLowerCase().includes(search) && !effNote(t,id).toLowerCase().includes(search)) return false;
      return true;
    })
    .sort((a,b) => b.amount - a.amount);
}

function renderTxns(id) {
  const filtered = getFilteredTxns(id);
  const tbody = document.getElementById('tbody-'+id);
  const nores = document.getElementById('nores-'+id);
  if (!filtered.length) { tbody.innerHTML=''; nores.style.display='block'; return; }
  nores.style.display='none';
  tbody.innerHTML = filtered.map(t => {
    const cat  = effCat(t, id);
    const col  = catColor(cat);
    const cls  = t.credit ? 'amt-credit' : (t.amount>=10000?'amt-large':'amt-debit');
    const rKey = reimbKey(t, id);
    const eKey = excludeKey(t, id);
    const cKey = catOverrideKey(t, id);
    const nKey = noteKey(t, id);
    const isReimb = effReimb(t, id);
    const isExcl  = effExcl(t, id);
    const noteVal = effNote(t, id);
    const catOpts = allCategories().map(c => `<option value="${c}"${c===cat?' selected':''}>${c}</option>`).join('');
    return `<tr class="${isReimb?'reimb-row':''} ${isExcl?'exclude-row':''}">
      <td style="color:#8b8fa8;white-space:nowrap">${t.date}</td>
      <td>${t.merchant}<br><span class="card-tag">${t.card||''}</span></td>
      <td><select class="cat-select" style="background:${col}22;color:${col}" onchange="setCatOverride('${id}','${cKey.replace(/'/g,"\\'")}',this.value)">${catOpts}</select></td>
      <td style="text-align:right" class="${cls}">${t.credit?'−':''}${fmt(t.amount)}</td>
      <td style="min-width:160px"><input type="text" class="note-input" placeholder="add note…" value="${noteVal.replace(/"/g,'&quot;')}" onchange="setNote('${id}','${nKey.replace(/'/g,"\\'")}',this.value); this.blur();"></td>
      <td style="text-align:right;width:160px;white-space:nowrap">
        <button class="reimb-btn${isReimb?' active':''}" onclick="toggleReimburse('${id}','${rKey.replace(/'/g,"\\'")}')">${isReimb?'↩ marked':'↩ reimburse'}</button>
        <button class="exclude-btn${isExcl?' active':''}" onclick="toggleExclude('${id}','${eKey.replace(/'/g,"\\'")}')">${isExcl?'✕ excluded':'✕ exclude'}</button>
      </td>
    </tr>`;
  }).join('');
}

const MONTH_MAP = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};

function parseTxnDate(t, stmt) {
  // t.date like "5 Apr" or "28 Mar"
  const parts = t.date.trim().split(' ');
  const day = parseInt(parts[0], 10);
  const mon = MONTH_MAP[parts[1]];
  // year from stmt.id e.g. "apr-2026"
  const year = parseInt(stmt.id.split('-')[1], 10);
  return new Date(year, mon, day);
}

let rangeTxnChart = null;

function buildRangeView() {
  const container = document.getElementById('view-range');

  // Compute min/max dates across all statements
  let minDate = null, maxDate = null;
  STATEMENTS.forEach(stmt => {
    stmt.txns.forEach(t => {
      const d = parseTxnDate(t, stmt);
      if (!minDate || d < minDate) minDate = d;
      if (!maxDate || d > maxDate) maxDate = d;
    });
  });

  const toISO = d => d ? d.toISOString().slice(0,10) : '';

  container.innerHTML = `
    <div class="range-controls">
      <label>From<input type="date" id="range-from" value="${toISO(minDate)}"></label>
      <label>To<input type="date" id="range-to" value="${toISO(maxDate)}"></label>
      <button class="range-apply" onclick="applyRange()">Apply</button>
      <div class="range-summary" id="range-summary"></div>
    </div>
    <div class="range-kpi-row" id="range-kpis"></div>
    <div class="charts-row" style="margin-bottom:24px" id="range-charts"></div>
    <div class="txn-card" id="range-txns-card" style="display:none">
      <div class="txn-top">
        <h2 style="font-size:12px;font-weight:600;color:#8b8fa8;text-transform:uppercase;letter-spacing:.6px">Transactions</h2>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="range-search" class="search-box" placeholder="Search…" oninput="renderRangeTxns()" style="width:180px">
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px" id="range-cat-filters"></div>
      <table class="txn"><thead><tr>
        <th>Date</th><th>Merchant</th><th>Category</th><th style="text-align:right">Amount</th><th>Notes</th><th></th>
      </tr></thead>
      <tbody id="range-tbody"></tbody></table>
      <div id="range-nores" style="display:none;text-align:center;padding:30px;color:#8b8fa8;font-size:13px">No transactions found.</div>
    </div>`;

  applyRange();
}

let rangeActiveCat = 'All';
let rangeTxns = [];

function applyRange() {
  const fromVal = document.getElementById('range-from').value;
  const toVal   = document.getElementById('range-to').value;
  if (!fromVal || !toVal) return;

  const from = new Date(fromVal);
  const to   = new Date(toVal);
  to.setHours(23,59,59);

  // Collect all txns across statements in range
  rangeTxns = [];
  STATEMENTS.forEach(stmt => {
    stmt.txns.forEach(t => {
      const d = parseTxnDate(t, stmt);
      if (d >= from && d <= to) {
        rangeTxns.push({ ...t, _stmtId: stmt.id, _date: d });
      }
    });
  });

  rangeTxns.sort((a,b) => b.amount - a.amount);

  // KPIs
  const debits  = rangeTxns.filter(t => !t.credit && !effExcl(t, t._stmtId));
  const credits  = rangeTxns.filter(t => t.credit);
  const total   = debits.reduce((s,t)=>s+t.amount,0) - credits.reduce((s,t)=>s+t.amount,0);
  const days    = Math.max(1, Math.round((to - from) / 86400000) + 1);
  const avgDay  = total / days;

  const catMap = {};
  debits.forEach(t => { const c = effCat(t, t._stmtId); catMap[c]=(catMap[c]||0)+t.amount; });
  const topCat = Object.entries(catMap).sort((a,b)=>b[1]-a[1])[0];

  document.getElementById('range-kpis').innerHTML = `
    <div class="kpi red"><div class="label">Total Spend</div><div class="value">${fmtL(total)}</div><div class="sub">${debits.length} transactions</div></div>
    <div class="kpi blue"><div class="label">Avg / Day</div><div class="value">${fmt(avgDay)}</div><div class="sub">${days} days</div></div>
    <div class="kpi yellow"><div class="label">Top Category</div><div class="value" style="font-size:16px">${topCat ? topCat[0] : '—'}</div><div class="sub">${topCat ? fmt(topCat[1]) : ''}</div></div>
    <div class="kpi teal"><div class="label">Credits / Refunds</div><div class="value">${fmt(credits.reduce((s,t)=>s+t.amount,0))}</div><div class="sub">${credits.length} entries</div></div>
    <div class="kpi"><div class="label">Date Range</div><div class="value" style="font-size:14px">${from.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div><div class="sub">to ${to.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</div></div>`;

  // Charts
  const cats = Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const chartsEl = document.getElementById('range-charts');
  chartsEl.innerHTML = `
    <div class="card">
      <h2>Category Breakdown</h2>
      <div class="donut-wrap"><canvas id="range-donut"></canvas>
        <div class="donut-center"><div class="big">${fmtL(total)}</div><div class="sm">net spend</div></div>
      </div>
      <div class="legend" id="range-legend"></div>
    </div>
    <div class="card">
      <h2>Spend by Category</h2>
      <div class="bar-wrap"><canvas id="range-bar"></canvas></div>
    </div>`;

  const legendEl = document.getElementById('range-legend');
  legendEl.innerHTML = cats.map(([name,amt]) =>
    `<div class="legend-item"><span class="dot" style="background:${catColor(name)}"></span><span class="legend-name">${name}</span><span class="legend-amt">${fmt(amt)}</span><span class="legend-pct">${total>0?Math.round(amt/total*100):0}%</span></div>`
  ).join('');

  if (rangeTxnChart) { rangeTxnChart.destroy(); rangeTxnChart = null; }

  requestAnimationFrame(() => {
    new Chart(document.getElementById('range-donut'), {
      type:'doughnut',
      data:{ labels:cats.map(c=>c[0]), datasets:[{ data:cats.map(c=>c[1]), backgroundColor:cats.map(c=>catColor(c[0])), borderWidth:2, borderColor:'#1a1d2e', hoverOffset:6 }] },
      options:{ cutout:'72%', plugins:{ legend:{display:false}, tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${fmt(ctx.parsed)}`}} }, animation:{duration:500} }
    });
    rangeTxnChart = new Chart(document.getElementById('range-bar'), {
      type:'bar',
      data:{ labels:cats.map(c=>c[0]), datasets:[{ data:cats.map(c=>c[1]), backgroundColor:cats.map(c=>catColor(c[0])+'bb'), borderColor:cats.map(c=>catColor(c[0])), borderWidth:1, borderRadius:4 }] },
      options:{ indexAxis:'y', plugins:{legend:{display:false}, tooltip:{callbacks:{label:ctx=>` ${fmt(ctx.parsed.x)}`}}}, scales:{ x:{grid:{color:'#2a2d3e'},ticks:{color:'#8b8fa8',callback:v=>'₹'+(v/1000).toFixed(0)+'k'}}, y:{grid:{display:false},ticks:{color:'#c8cad8',font:{size:11}}} }, animation:{duration:500} }
    });
  });

  // Category + special filter buttons
  rangeActiveCat = 'All';
  const filterEl = document.getElementById('range-cat-filters');
  const allCats = ['All', ...cats.map(c=>c[0])];
  filterEl.innerHTML = allCats.map(c =>
    `<button class="filter-btn${c==='All'?' active':''}" onclick="setRangeCat('${c}',this)">${c}</button>`
  ).join('') +
  `<button class="filter-btn" style="border-color:#2ec4b6" onclick="setRangeCat('__reimburse__',this)">↩ Reimbursable</button>` +
  `<button class="filter-btn" style="border-color:#e63946" onclick="setRangeCat('__excluded__',this)">✕ Excluded</button>`;

  document.getElementById('range-txns-card').style.display = 'block';
  document.getElementById('range-summary').textContent = `${debits.length + credits.length} transactions matched`;
  renderRangeTxns();
}

function setRangeCat(cat, btn) {
  rangeActiveCat = cat;
  document.querySelectorAll('#range-cat-filters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderRangeTxns();
}

function renderRangeTxns() {
  const search = (document.getElementById('range-search')?.value || '').toLowerCase();
  const showExcluded = rangeActiveCat === '__excluded__';
  const showReimb    = rangeActiveCat === '__reimburse__';

  const filtered = rangeTxns.filter(t => {
    const id    = t._stmtId;
    const isExcl  = effExcl(t, id);
    if (showExcluded) return isExcl;
    if (isExcl) return false;
    if (showReimb && !effReimb(t, id)) return false;
    if (!showReimb && rangeActiveCat !== 'All' && effCat(t, id) !== rangeActiveCat) return false;
    if (search && !t.merchant.toLowerCase().includes(search) && !effCat(t, id).toLowerCase().includes(search) && !effNote(t,id).toLowerCase().includes(search)) return false;
    return true;
  });

  const tbody = document.getElementById('range-tbody');
  const nores  = document.getElementById('range-nores');
  if (!filtered.length) { tbody.innerHTML=''; nores.style.display='block'; return; }
  nores.style.display = 'none';

  tbody.innerHTML = filtered.map(t => {
    const id      = t._stmtId;
    const cat     = effCat(t, id);
    const col     = catColor(cat);
    const cls     = t.credit ? 'amt-credit' : (t.amount>=10000?'amt-large':'amt-debit');
    const rKey    = reimbKey(t, id);
    const eKey    = excludeKey(t, id);
    const nKey    = noteKey(t, id);
    const isReimb = effReimb(t, id);
    const isExcl  = effExcl(t, id);
    const noteVal = effNote(t, id);
    return `<tr class="${isReimb?'reimb-row':''} ${isExcl?'exclude-row':''}">
      <td style="color:#8b8fa8;font-size:12px;white-space:nowrap">${t.date}</td>
      <td>${t.merchant}<br><span class="card-tag">${t.card||''}</span></td>
      <td><span class="cat-pill" style="background:${col}22;color:${col}">${cat}</span></td>
      <td class="${cls}" style="text-align:right">${t.credit?'+':''}${fmt(t.amount)}</td>
      <td style="min-width:160px"><input type="text" class="note-input" placeholder="add note…" value="${noteVal.replace(/"/g,'&quot;')}" onchange="setNote('${id}','${nKey.replace(/'/g,"\\'")}',this.value); this.blur();"></td>
      <td style="text-align:right;white-space:nowrap">
        <button class="reimb-btn${isReimb?' active':''}" onclick="toggleReimburse('${id}','${rKey.replace(/'/g,"\\'")}');renderRangeTxns()">${isReimb?'↩ marked':'↩ reimburse'}</button>
        <button class="exclude-btn${isExcl?' active':''}" onclick="toggleExclude('${id}','${eKey.replace(/'/g,"\\'")}');renderRangeTxns()">${isExcl?'✕ excluded':'✕ exclude'}</button>
      </td>
    </tr>`;
  }).join('');
}

let activeView = 'trends';

function showView(id) {
  activeView = id;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-'+id)?.classList.add('active');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-'+id)?.classList.add('active');
  if (id === 'range') requestAnimationFrame(applyRange);

  // update header meta
  if (id === 'trends' || id === 'range') {
    document.getElementById('headerMeta').innerHTML = `<div>${STATEMENTS.length} statement${STATEMENTS.length>1?'s':''} loaded</div>`;
  } else {
    const stmt = STATEMENTS.find(s=>s.id===id);
    document.getElementById('headerMeta').innerHTML = `<div>${stmt.period}</div><div style="margin-top:2px">Outstanding ₹${stmt.outstanding.toLocaleString('en-IN')}</div>`;
  }
}

function buildTabs() {
  const bar = document.getElementById('tabBar');

  // Trends tab first
  const trendsTab = document.createElement('div');
  trendsTab.className = 'tab trends' + (activeView==='trends'?' active':'');
  trendsTab.id = 'tab-trends';
  trendsTab.textContent = 'Trends';
  trendsTab.onclick = () => showView('trends');
  bar.appendChild(trendsTab);

  // Range tab
  const rangeTab = document.createElement('div');
  rangeTab.className = 'tab trends' + (activeView==='range'?' active':'');
  rangeTab.id = 'tab-range';
  rangeTab.textContent = 'Date Range';
  rangeTab.onclick = () => showView('range');
  bar.appendChild(rangeTab);

  const div = document.createElement('div');
  div.className = 'tab-divider';
  bar.appendChild(div);

  STATEMENTS.forEach(stmt => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (activeView===stmt.id?' active':'');
    tab.id = 'tab-'+stmt.id;
    tab.textContent = stmt.label;
    tab.onclick = () => showView(stmt.id);
    bar.appendChild(tab);
  });
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
buildTabs();
buildTrendsView();
buildRangeView();
STATEMENTS.forEach(buildMonthView);
showView(STATEMENTS.length ? STATEMENTS[0].id : 'trends');

// Pull latest cloud state (async) and re-render once it lands, so the page
// shows cached/local data instantly but corrects to the synced state a
// moment later rather than staying blank while waiting on the network.
pullCloudState().then(() => {
  STATEMENTS.forEach(s => updateMonthView(s.id, activeTopCard[s.id] || 'All'));
  _allCategoriesCache = null; // category overrides may have changed the set
});

</script>
</body>
</html>
